[env:ttgo-lora32-v21]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 921600
lib_deps = 
	ModbusClient=https://github.com/eModbus/eModbus.git
	jgromes/RadioLib@^7.0.0

; Demo build: simulates Modbus registers, no physical RS485 traffic.
[env:ttgo-lora32-v21-sim]
extends = env:ttgo-lora32-v21
build_flags =
	-DSIMULATION_MODE=1
	-DSIM_POLL_INTERVAL_MS=10000
