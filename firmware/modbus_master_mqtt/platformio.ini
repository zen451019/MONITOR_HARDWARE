[env:ttgo-lora32-v21]
platform = espressif32@7.1.3
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_flags =
	-Wall
	-Wextra
	-DLOG_LEVEL=3
lib_deps =
	ModbusClient=https://github.com/eModbus/eModbus.git#v1.7.4.stable
	nanopb/Nanopb@0.4.92
